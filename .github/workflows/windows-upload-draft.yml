name: Windows upload reviewed draft assets
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run ID reviewed before upload
        required: true
        type: string
      tag:
        description: Existing Windows prerelease draft tag
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: windows-draft-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify reviewed build and existing draft
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^windows-v[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9.]+$ ]]
          gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID" > run.json
          jq -e --arg repo "$REPOSITORY" '.conclusion == "success" and .head_repository.full_name == $repo and .event == "push" and .path == ".github/workflows/windows-verify.yml"' run.json
          gh release view "$RELEASE_TAG" -R "$REPOSITORY" --json isDraft,isPrerelease,targetCommitish > draft.json
          jq -e --arg sha "$(jq -r .head_sha run.json)" '.isDraft == true and .isPrerelease == true and .targetCommitish == $sha' draft.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: compositor-windows-x64
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify checksums and relay reviewed assets to draft
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg sha "$(jq -r .head_sha run.json)" '.sourceCommit == $sha and .privatePatternMatches == 0 and .readOnly == false and (.editing | startswith("revision-bound"))' candidate/release/PACKAGE-REVIEW.json
          cd candidate/release
          sha256sum --check SHA256SUMS.txt
          for asset in Compositor-Windows-*.exe Compositor-Windows-*.zip SHA256SUMS.txt PACKAGE-REVIEW.json; do
            gh release upload "$RELEASE_TAG" "$asset" -R "$REPOSITORY" --clobber
          done
          gh release view "$RELEASE_TAG" -R "$REPOSITORY" --json isDraft,isPrerelease,assets
# This workflow uploads only to an existing draft; publication and latest checks
# remain a separate reviewed step documented in docs/windows-install.md.
